version: "3.9"

services:
  backend:
    build:
      context: ./ai-server
    container_name: stock-lstm-api

    ports:
      - "8000:8000"

    volumes:
      - ./ai-server:/app
      - ./ai-model/artifacts:/app/ai-model-artifacts

    environment:
      - ARTIFACTS_DIR=/app/ai-model-artifacts

    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: stock-lstm-react

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: always
